---
# Data-driven ROM romhack patcher. See group_vars/all/rom_patches.yml and
# docs/rom-patches.md.

- name: Revert ROM patches when requested
  when: dg_rom_patches_revert | bool
  block:
    - name: Remove patched ROMs
      ansible.builtin.file:
        path: "{{ item.out }}"
        state: absent
      loop: "{{ dg_rom_patches }}"
      loop_control:
        label: "{{ item.name }}"
    - name: Find MSU-1 sidecars linked beside patched ROMs
      ansible.builtin.find:
        paths: "{{ item.out | dirname }}"
        patterns: "{{ (item.out | basename | splitext | first) }}.msu,{{ (item.out | basename | splitext | first) }}-*.pcm"
      register: _rp_revert_msu
      loop: "{{ dg_rom_patches }}"
      loop_control:
        label: "{{ item.name }}"
      when: item.msu_src is defined
    - name: Remove MSU-1 sidecars
      ansible.builtin.file:
        path: "{{ _msu_file.path }}"
        state: absent
      loop: >-
        {{ _rp_revert_msu.results | default([])
           | selectattr('files', 'defined') | map(attribute='files') | flatten }}
      loop_control:
        loop_var: _msu_file
        label: "{{ _msu_file.path | basename }}"
    - name: Restore originals that were replaced in place
      ansible.builtin.shell: |
        if [ -f "{{ item.out }}.bak" ]; then mv -f "{{ item.out }}.bak" "{{ item.out }}"; echo restored; fi
      loop: "{{ dg_rom_patches }}"
      loop_control:
        label: "{{ item.name }}"
      when: item.backup | default(false)
      register: _rp_restore
      changed_when: "'restored' in _rp_restore.stdout"

    - name: Report ROM patches reverted
      ansible.builtin.debug:
        msg: >-
          Removed patched ROMs. Base/original dumps on the NAS are untouched.

- name: Apply each ROM patch
  ansible.builtin.include_tasks: patch.yml
  loop: "{{ dg_rom_patches }}"
  loop_control:
    label: "{{ item.name }}"
  when: not (dg_rom_patches_revert | bool)
