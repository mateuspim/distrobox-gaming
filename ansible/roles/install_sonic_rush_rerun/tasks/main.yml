---
# Sonic Rush Rerun — Unity Windows exe under Wine (no Linux build).
# See group_vars/all/sonic_rush_rerun.yml and docs/sonic-fan-pack.md.

- name: Revert Sonic Rush Rerun when requested
  when: dg_sonicrush_revert | bool
  block:
    - name: Remove the Sonic Rush Rerun launcher, install dir and prefix
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ dg_sonicrush_bin }}"
        - "{{ dg_sonicrush_install_dir }}"
        - "{{ dg_sonicrush_prefix }}"
    - name: Report Sonic Rush Rerun reverted
      ansible.builtin.debug:
        msg: "Sonic Rush Rerun removed. The NAS rar is untouched."

- name: Install Sonic Rush Rerun
  when: not (dg_sonicrush_revert | bool)
  block:
    - name: Verify the NAS rar exists
      ansible.builtin.stat:
        path: "{{ dg_sonicrush_rar }}"
      register: _sonicrush_rar
      failed_when: not _sonicrush_rar.stat.exists

    - name: Create directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ dg_sonicrush_install_dir }}"
        - "{{ dg_box_home }}/bin"

    - name: Extract the game (once)
      ansible.builtin.shell: |
        set -eu
        [ -f "{{ dg_sonicrush_game_dir }}/{{ dg_sonicrush_exe }}" ] && exit 0
        unrar x -o+ -idq "{{ dg_sonicrush_rar }}" "{{ dg_sonicrush_install_dir }}/"
        echo extracted-sonicrush
      register: _sonicrush_extract
      changed_when: "'extracted-sonicrush' in _sonicrush_extract.stdout"

    - name: Initialize the Wine prefix
      ansible.builtin.shell: |
        {{ dg_in_box }} bash -c '
          set -eu
          [ -d "{{ dg_sonicrush_prefix }}/drive_c" ] && exit 0
          export WINEPREFIX="{{ dg_sonicrush_prefix }}"
          "{{ dg_sonicrush_wine_bin_dir }}/wineboot" -i >/dev/null 2>&1 || true
          "{{ dg_sonicrush_wine_bin_dir }}/wineserver" -w || true
          echo prefix-created
        '
      register: _sonicrush_prefix
      changed_when: "'prefix-created' in _sonicrush_prefix.stdout"

    - name: Force the GLX OpenGL backend (wine 11 EGL -> iGPU regression)
      ansible.builtin.shell: |
        {{ dg_in_box }} bash -c '
          export WINEPREFIX="{{ dg_sonicrush_prefix }}"
          W="{{ dg_sonicrush_wine_bin_dir }}"
          "$W/wine" reg query "HKCU\\Software\\Wine\\X11 Driver" /v UseEGL 2>/dev/null | grep -q N && exit 0
          "$W/wine" reg add "HKCU\\Software\\Wine\\X11 Driver" /v UseEGL /d N /f >/dev/null
          "$W/wineserver" -w || true
          echo egl-pinned
        '
      register: _sonicrush_egl
      changed_when: "'egl-pinned' in _sonicrush_egl.stdout"

    - name: Route controllers through SDL (winebus) so the 8BitDo reaches the game
      ansible.builtin.shell: |
        {{ dg_in_box }} bash -c '
          export WINEPREFIX="{{ dg_sonicrush_prefix }}"
          W="{{ dg_sonicrush_wine_bin_dir }}"
          "$W/wine" reg add "HKCU\\Software\\Wine\\WineBus" /v "{{ item.name }}" /t REG_DWORD /d {{ item.value }} /f >/dev/null
          "$W/wineserver" -w || true
        '
      loop: "{{ dg_sonicrush_winebus_registry }}"
      loop_control:
        label: "{{ item.name }}={{ item.value }}"
      changed_when: true

    - name: Deploy the launcher
      ansible.builtin.template:
        src: sonic-rush-rerun.sh.j2
        dest: "{{ dg_sonicrush_bin }}"
        mode: "0755"

    - name: Render the desktop entry
      ansible.builtin.template:
        src: gaming-sonic-rush-rerun.desktop.j2
        dest: "{{ dg_desktop_render_dir }}/gaming-sonic-rush-rerun.desktop"
        mode: "0644"

    - name: Install the desktop entry into the host applications dir
      ansible.builtin.command:
        cmd: "{{ dg_project_root }}/scripts/install-host-launchers.sh"
      environment:
        DG_DESKTOP_RENDER_DIR: "{{ dg_desktop_render_dir }}"
        DG_HOST_APPLICATIONS_DIR: "{{ dg_host_applications_dir }}"
      register: _sonicrush_host_launchers
      changed_when: >-
        'installed ' in _sonicrush_host_launchers.stdout or
        'removed stale ' in _sonicrush_host_launchers.stdout

    - name: Report
      ansible.builtin.debug:
        msg: >-
          Sonic Rush Rerun {{ dg_sonicrush_version }} under Wine at
          {{ dg_sonicrush_install_dir }}; launcher {{ dg_sonicrush_bin }}
          (fullscreen via gamescope). Revert: -e dg_sonicrush_revert=true.
