---
# Sonic Legends — GameMaker Studio 2 exe under Wine (no Linux build).
# See group_vars/all/sonic_legends.yml and docs/sonic-fan-pack.md.

- name: Revert Sonic Legends when requested
  when: dg_soniclegends_revert | bool
  block:
    - name: Remove the Sonic Legends launcher, install dir and prefix
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ dg_soniclegends_bin }}"
        - "{{ dg_soniclegends_install_dir }}"
        - "{{ dg_soniclegends_prefix }}"
    - name: Report Sonic Legends reverted
      ansible.builtin.debug:
        msg: "Sonic Legends removed. The NAS zip is untouched."

- name: Install Sonic Legends
  when: not (dg_soniclegends_revert | bool)
  block:
    - name: Verify the NAS zip exists
      ansible.builtin.stat:
        path: "{{ dg_soniclegends_zip }}"
      register: _soniclegends_zip
      failed_when: not _soniclegends_zip.stat.exists

    - name: Create directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ dg_soniclegends_install_dir }}"
        - "{{ dg_box_home }}/bin"

    - name: Extract the game (once)
      ansible.builtin.shell: |
        set -eu
        [ -f "{{ dg_soniclegends_install_dir }}/{{ dg_soniclegends_exe }}" ] && exit 0
        unzip -oq "{{ dg_soniclegends_zip }}" -d "{{ dg_soniclegends_install_dir }}"
        echo extracted-soniclegends
      register: _soniclegends_extract
      changed_when: "'extracted-soniclegends' in _soniclegends_extract.stdout"

    - name: Initialize the Wine prefix
      ansible.builtin.shell: |
        {{ dg_in_box }} bash -c '
          set -eu
          [ -d "{{ dg_soniclegends_prefix }}/drive_c" ] && exit 0
          export WINEPREFIX="{{ dg_soniclegends_prefix }}"
          "{{ dg_soniclegends_wine_bin_dir }}/wineboot" -i >/dev/null 2>&1 || true
          "{{ dg_soniclegends_wine_bin_dir }}/wineserver" -w || true
          echo prefix-created
        '
      register: _soniclegends_prefix
      changed_when: "'prefix-created' in _soniclegends_prefix.stdout"

    - name: Force the GLX OpenGL backend (wine 11 EGL -> iGPU regression)
      ansible.builtin.shell: |
        {{ dg_in_box }} bash -c '
          export WINEPREFIX="{{ dg_soniclegends_prefix }}"
          W="{{ dg_soniclegends_wine_bin_dir }}"
          "$W/wine" reg query "HKCU\\Software\\Wine\\X11 Driver" /v UseEGL 2>/dev/null | grep -q N && exit 0
          "$W/wine" reg add "HKCU\\Software\\Wine\\X11 Driver" /v UseEGL /d N /f >/dev/null
          "$W/wineserver" -w || true
          echo egl-pinned
        '
      register: _soniclegends_egl
      changed_when: "'egl-pinned' in _soniclegends_egl.stdout"

    - name: Route controllers through SDL (winebus) so the 8BitDo reaches the game
      ansible.builtin.shell: |
        {{ dg_in_box }} bash -c '
          export WINEPREFIX="{{ dg_soniclegends_prefix }}"
          W="{{ dg_soniclegends_wine_bin_dir }}"
          "$W/wine" reg add "HKCU\\Software\\Wine\\WineBus" /v "{{ item.name }}" /t REG_DWORD /d {{ item.value }} /f >/dev/null
          "$W/wineserver" -w || true
        '
      loop: "{{ dg_soniclegends_winebus_registry }}"
      loop_control:
        label: "{{ item.name }}={{ item.value }}"
      changed_when: true

    - name: Deploy the launcher
      ansible.builtin.template:
        src: sonic-legends.sh.j2
        dest: "{{ dg_soniclegends_bin }}"
        mode: "0755"

    - name: Render the desktop entry
      ansible.builtin.template:
        src: gaming-sonic-legends.desktop.j2
        dest: "{{ dg_desktop_render_dir }}/gaming-sonic-legends.desktop"
        mode: "0644"

    - name: Install the desktop entry into the host applications dir
      ansible.builtin.command:
        cmd: "{{ dg_project_root }}/scripts/install-host-launchers.sh"
      environment:
        DG_DESKTOP_RENDER_DIR: "{{ dg_desktop_render_dir }}"
        DG_HOST_APPLICATIONS_DIR: "{{ dg_host_applications_dir }}"
      register: _soniclegends_host_launchers
      changed_when: >-
        'installed ' in _soniclegends_host_launchers.stdout or
        'removed stale ' in _soniclegends_host_launchers.stdout

    - name: Report
      ansible.builtin.debug:
        msg: >-
          Sonic Legends {{ dg_soniclegends_version }} under Wine at
          {{ dg_soniclegends_install_dir }}; launcher {{ dg_soniclegends_bin }}
          (fullscreen via gamescope). Revert: -e dg_soniclegends_revert=true.
