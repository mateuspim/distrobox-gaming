---
# Beetle Adventure Racing! Recompiled — prebuilt Windows RT64 build under Wine
# + vkd3d-proton. See group_vars/all/beetle_recomp.yml and docs/beetle-recomp.md.

- name: Revert Beetle Adventure Racing recomp when requested
  when: dg_bar_revert | bool
  block:
    - name: Remove the launcher + install dir + Wine prefix
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ dg_bar_launcher }}"
        - "{{ dg_bar_install_dir }}"
        - "{{ dg_bar_prefix }}"
    - name: Report reverted
      ansible.builtin.debug:
        msg: "Beetle Adventure Racing recomp removed. The NAS zip + z64 ROM are kept."

- name: Install Beetle Adventure Racing recomp
  when: not (dg_bar_revert | bool)
  block:
    - name: Verify the Beetle Adventure Racing! (USA) ROM exists
      ansible.builtin.stat:
        path: "{{ dg_bar_rom_src }}"
      register: _bar_rom
      failed_when: not _bar_rom.stat.exists

    - name: Install Wine runtime packages
      ansible.builtin.shell: >-
        {{ dg_in_box }} sudo pacman -S --needed --noconfirm {{ dg_bar_packages | join(' ') }}
      register: _bar_pac
      changed_when: "'installing' in _bar_pac.stdout or 'upgrading' in _bar_pac.stdout"

    - name: Ensure the NAS release dir exists
      ansible.builtin.file:
        path: "{{ dg_bar_root }}"
        state: directory
        mode: "0755"

    - name: Download the prebuilt Windows build (hash-pinned)
      ansible.builtin.get_url:
        url: "{{ dg_bar_zip_url }}"
        dest: "{{ dg_bar_zip }}"
        checksum: "sha256:{{ dg_bar_zip_sha256 }}"
        mode: "0644"

    - name: Extract the build (once)
      ansible.builtin.shell: |
        set -eu
        inst="{{ dg_bar_install_dir }}"
        [ -f "$inst/{{ dg_bar_exe }}" ] && exit 0
        mkdir -p "$inst"
        # unzip exits 1 on harmless warnings (backslash separators in this zip,
        # attribute restore on the NAS mount) — accept 0/1, verify by content.
        rc=0; unzip -oq "{{ dg_bar_zip }}" -d "$inst" || rc=$?
        [ "$rc" -le 1 ] || exit "$rc"
        [ -f "$inst/{{ dg_bar_exe }}" ]
        echo bar-extracted
      register: _bar_extract
      changed_when: "'bar-extracted' in _bar_extract.stdout"

    - name: Convert the ROM to a big-endian z64 + verify sha1 (creates once)
      ansible.builtin.shell: |
        python3 - <<'PY'
        import hashlib
        src = "{{ dg_bar_rom_src }}"; dst = "{{ dg_bar_rom_z64 }}"
        d = open(src, 'rb').read(); m = d[:4]
        if m == b'\x80\x37\x12\x40': z = d
        elif m == b'\x37\x80\x40\x12':
            b = bytearray(d); b[0::2], b[1::2] = d[1::2], d[0::2]; z = bytes(b)
        elif m == b'\x40\x12\x37\x80':
            b = bytearray(len(d))
            for i in range(0, len(d) & ~3, 4): b[i:i+4] = d[i:i+4][::-1]
            z = bytes(b)
        else: raise SystemExit("unknown ROM byte order: " + m.hex())
        # sanity: 16 MiB Beetle Adventure Racing
        if len(z) != 16 * 1024 * 1024: raise SystemExit("unexpected ROM size: %d" % len(z))
        h = hashlib.sha1(z).hexdigest()
        if h != "{{ dg_bar_rom_sha1 }}": raise SystemExit("ROM sha1 mismatch: got " + h)
        open(dst, 'wb').write(z); print("z64 ok (sha1 %s)" % h)
        PY
      args:
        creates: "{{ dg_bar_rom_z64 }}"

    - name: Create/refresh the Wine prefix
      ansible.builtin.shell: |
        {{ dg_in_box }} sh -lc '
          set -eu
          export WINEPREFIX="{{ dg_bar_prefix }}" WINEDEBUG=-all WINEARCH=win64
          if [ ! -d "$WINEPREFIX/drive_c" ]; then wineboot -i >/dev/null 2>&1; echo bar-prefix-created; fi
        '
      register: _bar_prefix
      changed_when: "'bar-prefix-created' in _bar_prefix.stdout"

    - name: Install GE-Proton's DXVK + vkd3d-proton DLLs into the prefix
      # RT64 renders via D3D12; Wine's built-in vkd3d can't map the DXGI adapter,
      # so use GE-Proton's DXVK (dxgi,d3d11) + vkd3d-proton (d3d12,d3d12core).
      ansible.builtin.shell: |
        {{ dg_in_box }} sh -lc '
          set -eu
          ge="$(ls -d {{ dg_bar_geproton_glob }} 2>/dev/null | sort -V | tail -1)"
          [ -n "$ge" ] || { echo "NO_GE_PROTON"; exit 1; }
          sys="{{ dg_bar_prefix }}/drive_c/windows/system32"; w="$ge/files/lib/wine"
          cp -f "$w/dxvk/x86_64-windows/dxgi.dll"              "$sys/"
          cp -f "$w/dxvk/x86_64-windows/d3d11.dll"             "$sys/"
          cp -f "$w/vkd3d-proton/x86_64-windows/d3d12.dll"     "$sys/"
          cp -f "$w/vkd3d-proton/x86_64-windows/d3d12core.dll" "$sys/"
          echo "bar-dlls:$(basename "$ge")"
        '
      register: _bar_dlls
      changed_when: "'bar-dlls:' in _bar_dlls.stdout"

    - name: Deploy the launcher
      ansible.builtin.template:
        src: beetle-launch.sh.j2
        dest: "{{ dg_bar_launcher }}"
        mode: "0755"

    - name: Render + install the desktop entry
      ansible.builtin.template:
        src: beetle.desktop.j2
        dest: "{{ dg_desktop_render_dir }}/gaming-beetle-recomp.desktop"
        mode: "0644"

    - name: Install the desktop entry into the host applications dir
      ansible.builtin.command:
        cmd: "{{ dg_project_root }}/scripts/install-host-launchers.sh"
      environment:
        DG_DESKTOP_RENDER_DIR: "{{ dg_desktop_render_dir }}"
        DG_HOST_APPLICATIONS_DIR: "{{ dg_host_applications_dir }}"
      register: _bar_host
      changed_when: "'installed ' in _bar_host.stdout or 'removed stale ' in _bar_host.stdout"

    - name: Report
      ansible.builtin.debug:
        msg:
          - "Beetle Adventure Racing! Recompiled {{ dg_bar_version }} at {{ dg_bar_install_dir }}; launcher {{ dg_bar_launcher }} (Walker: Beetle Adventure Racing · Recompiled)."
          - "Prebuilt Windows RT64 build under Wine + vkd3d-proton on the RTX (VK_ICD nvidia). ROM verified as USA (sha1). Gamepad + keyboard supported. Revert: -e dg_bar_revert=true."
