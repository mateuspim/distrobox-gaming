---
- name: Ensure rendered desktop directory exists
  ansible.builtin.file:
    path: "{{ dg_desktop_render_dir }}"
    state: directory
    mode: "0755"

- name: Render enabled desktop entry templates
  ansible.builtin.template:
    src: "{{ desktop_entry.name }}.j2"
    dest: "{{ dg_desktop_render_dir }}/{{ desktop_entry.name }}"
    mode: "0644"
  loop: "{{ dg_desktop_template_entries }}"
  loop_control:
    loop_var: desktop_entry
    label: "{{ desktop_entry.name }}"
  when: desktop_entry.enabled | default(true) | bool

- name: Remove disabled rendered desktop entry templates
  ansible.builtin.file:
    path: "{{ dg_desktop_render_dir }}/{{ desktop_entry.name }}"
    state: absent
  loop: "{{ dg_desktop_template_entries }}"
  loop_control:
    loop_var: desktop_entry
    label: "{{ desktop_entry.name }}"
  when: not (desktop_entry.enabled | default(true) | bool)

- name: Render generic emulator launcher desktop entries
  ansible.builtin.template:
    src: emulator-launcher.desktop.j2
    dest: "{{ dg_desktop_render_dir }}/{{ launcher.name }}.desktop"
    mode: "0644"
  loop: "{{ dg_emulator_launchers }}"
  loop_control:
    loop_var: launcher
    label: "{{ launcher.name }}"
  when: launcher.enabled | default(true) | bool

- name: Remove disabled generic emulator launcher desktop entries
  ansible.builtin.file:
    path: "{{ dg_desktop_render_dir }}/{{ launcher.name }}.desktop"
    state: absent
  loop: "{{ dg_emulator_launchers }}"
  loop_control:
    loop_var: launcher
    label: "{{ launcher.name }}"
  when: not (launcher.enabled | default(true) | bool)

- name: Remove disabled generic emulator launchers from host applications
  ansible.builtin.file:
    path: "{{ dg_host_applications_dir }}/{{ launcher.name }}.desktop"
    state: absent
  loop: "{{ dg_emulator_launchers }}"
  loop_control:
    loop_var: launcher
    label: "{{ launcher.name }}"
  when: not (launcher.enabled | default(true) | bool)

- name: Remove disabled template launchers from host applications
  ansible.builtin.file:
    path: "{{ dg_host_applications_dir }}/{{ desktop_entry.name }}"
    state: absent
  loop: "{{ dg_desktop_template_entries }}"
  loop_control:
    loop_var: desktop_entry
    label: "{{ desktop_entry.name }}"
  when: not (desktop_entry.enabled | default(true) | bool)

- name: Remove obsolete rendered desktop entries
  ansible.builtin.file:
    path: "{{ dg_desktop_render_dir }}/{{ item }}"
    state: absent
  loop:
    - gaming-sm64plus.desktop
    - Steam-Clean.desktop

- name: Remove obsolete host desktop entries
  ansible.builtin.file:
    path: "{{ dg_host_applications_dir }}/{{ item }}"
    state: absent
  loop:
    - gaming-sm64plus.desktop
    - Steam-Clean.desktop

- name: Check if desktop-file-validate is available
  ansible.builtin.command: "which desktop-file-validate"
  register: _dfv_check
  changed_when: false
  failed_when: false

- name: Find rendered desktop files
  ansible.builtin.find:
    paths: "{{ dg_desktop_render_dir }}"
    patterns: "*.desktop"
    file_type: file
  register: _rendered_desktop_files

- name: Validate desktop files
  ansible.builtin.command: "desktop-file-validate {{ item.path }}"
  loop: "{{ _rendered_desktop_files.files }}"
  loop_control:
    label: "{{ item.path | basename }}"
  changed_when: false
  failed_when: false
  when: _dfv_check.rc == 0

- name: Install rendered desktop files into host applications dir
  # Runs scripts/install-host-launchers.sh, which copies each installable
  # rendered entry into dg_host_applications_dir. Entries whose target binary
  # is missing are removed if their rendered source still exists; deleted
  # historical launchers should be listed in the obsolete cleanup tasks above.
  ansible.builtin.command:
    cmd: "{{ dg_project_root }}/scripts/install-host-launchers.sh"
  environment:
    DG_DESKTOP_RENDER_DIR: "{{ dg_desktop_render_dir }}"
    DG_HOST_APPLICATIONS_DIR: "{{ dg_host_applications_dir }}"
  register: _host_launchers
  changed_when: >-
    '[host-launchers] installed ' in _host_launchers.stdout or
    '[host-launchers] removed stale ' in _host_launchers.stdout
