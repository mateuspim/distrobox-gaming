---
# Sonic Overture — Clickteam Fusion 2.5 exe under Wine (no Linux build).
# See group_vars/all/sonic_overture.yml and docs/sonic-fan-pack.md.

- name: Revert Sonic Overture when requested
  when: dg_sonicoverture_revert | bool
  block:
    - name: Remove the Sonic Overture launcher, install dir and prefix
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ dg_sonicoverture_bin }}"
        - "{{ dg_sonicoverture_install_dir }}"
        - "{{ dg_sonicoverture_prefix }}"
    - name: Report Sonic Overture reverted
      ansible.builtin.debug:
        msg: "Sonic Overture removed. The NAS rar is untouched."

- name: Install Sonic Overture
  when: not (dg_sonicoverture_revert | bool)
  block:
    - name: Verify the NAS rar exists
      ansible.builtin.stat:
        path: "{{ dg_sonicoverture_rar }}"
      register: _sonicoverture_rar
      failed_when: not _sonicoverture_rar.stat.exists

    - name: Create directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ dg_sonicoverture_install_dir }}"
        - "{{ dg_box_home }}/bin"

    - name: Extract the game (once)
      ansible.builtin.shell: |
        set -eu
        [ -f "{{ dg_sonicoverture_game_dir }}/{{ dg_sonicoverture_exe }}" ] && exit 0
        unrar x -o+ -idq "{{ dg_sonicoverture_rar }}" "{{ dg_sonicoverture_install_dir }}/"
        echo extracted-sonicoverture
      register: _sonicoverture_extract
      changed_when: "'extracted-sonicoverture' in _sonicoverture_extract.stdout"

    - name: Initialize the Wine prefix
      ansible.builtin.shell: |
        {{ dg_in_box }} bash -c '
          set -eu
          [ -d "{{ dg_sonicoverture_prefix }}/drive_c" ] && exit 0
          export WINEPREFIX="{{ dg_sonicoverture_prefix }}"
          "{{ dg_sonicoverture_wine_bin_dir }}/wineboot" -i >/dev/null 2>&1 || true
          "{{ dg_sonicoverture_wine_bin_dir }}/wineserver" -w || true
          echo prefix-created
        '
      register: _sonicoverture_prefix
      changed_when: "'prefix-created' in _sonicoverture_prefix.stdout"

    - name: Force the GLX OpenGL backend (wine 11 EGL -> iGPU regression)
      ansible.builtin.shell: |
        {{ dg_in_box }} bash -c '
          export WINEPREFIX="{{ dg_sonicoverture_prefix }}"
          W="{{ dg_sonicoverture_wine_bin_dir }}"
          "$W/wine" reg query "HKCU\\Software\\Wine\\X11 Driver" /v UseEGL 2>/dev/null | grep -q N && exit 0
          "$W/wine" reg add "HKCU\\Software\\Wine\\X11 Driver" /v UseEGL /d N /f >/dev/null
          "$W/wineserver" -w || true
          echo egl-pinned
        '
      register: _sonicoverture_egl
      changed_when: "'egl-pinned' in _sonicoverture_egl.stdout"

    - name: Route controllers through SDL (winebus) so the 8BitDo reaches the game
      ansible.builtin.shell: |
        {{ dg_in_box }} bash -c '
          export WINEPREFIX="{{ dg_sonicoverture_prefix }}"
          W="{{ dg_sonicoverture_wine_bin_dir }}"
          "$W/wine" reg add "HKCU\\Software\\Wine\\WineBus" /v "{{ item.name }}" /t REG_DWORD /d {{ item.value }} /f >/dev/null
          "$W/wineserver" -w || true
        '
      loop: "{{ dg_sonicoverture_winebus_registry }}"
      loop_control:
        label: "{{ item.name }}={{ item.value }}"
      changed_when: true

    - name: Deploy the launcher
      ansible.builtin.template:
        src: sonic-overture.sh.j2
        dest: "{{ dg_sonicoverture_bin }}"
        mode: "0755"

    - name: Render the desktop entry
      ansible.builtin.template:
        src: gaming-sonic-overture.desktop.j2
        dest: "{{ dg_desktop_render_dir }}/gaming-sonic-overture.desktop"
        mode: "0644"

    - name: Install the desktop entry into the host applications dir
      ansible.builtin.command:
        cmd: "{{ dg_project_root }}/scripts/install-host-launchers.sh"
      environment:
        DG_DESKTOP_RENDER_DIR: "{{ dg_desktop_render_dir }}"
        DG_HOST_APPLICATIONS_DIR: "{{ dg_host_applications_dir }}"
      register: _sonicoverture_host_launchers
      changed_when: >-
        'installed ' in _sonicoverture_host_launchers.stdout or
        'removed stale ' in _sonicoverture_host_launchers.stdout

    - name: Report
      ansible.builtin.debug:
        msg: >-
          Sonic Overture {{ dg_sonicoverture_version }} under Wine at
          {{ dg_sonicoverture_install_dir }}; launcher {{ dg_sonicoverture_bin }}
          (fullscreen via gamescope). Revert: -e dg_sonicoverture_revert=true.
