---
# Omarchy workstation profile for mateuspim/odin.
# This file intentionally contains paths and non-secret hardware choices only.

dg_host_uid: 1000
dg_host_gid: 1000

# Fully qualify the image so rootless Podman never prompts for a short-name
# registry during unattended Ansible runs.
dg_image: docker.io/library/archlinux:latest

dg_data_root: /mnt/sleipnir/Emulation
dg_box_root: "{{ dg_data_root }}/distrobox/gaming"
dg_box_home: "{{ dg_box_root }}"

dg_external_games_root: "{{ dg_data_root }}"
dg_emudeck_root: "{{ dg_data_root }}/EmuDeck"
dg_roms_final_root: "{{ dg_data_root }}/ROMS_FINAL"
dg_rom_root: "{{ dg_emudeck_root }}/roms"
dg_rom_mid_root: "{{ dg_emudeck_root }}/roms_mid"
dg_rom_heavy_root: "{{ dg_emudeck_root }}/roms_heavy"
dg_rom_rare_root: "{{ dg_emudeck_root }}/roms_rare"
dg_bios_root: "{{ dg_emudeck_root }}/Emulation/bios"

# Steam is installed natively through Omarchy. The distrobox is dedicated to
# ES-DE and emulators, avoiding a second Steam client and library metadata.
dg_install_steam: false

# Start with ES-DE, RetroArch, Dolphin, DuckStation, PCSX2, PPSSPP, Flycast,
# and melonDS. Enable the advanced tier after the core GPU/audio/input checks.
dg_advanced_emulators_enabled: false

# Optional game ports and separately installed emulator launchers are outside
# this core-only milestone.
dg_optional_apps_enabled: false

# RTX 4080 dGPU plus AMD integrated graphics.
dg_nvidia_enabled: true
